<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Authenticating — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <style>
    .callback-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main, #f9fafb);
    }
    .callback-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .callback-card .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary, #16a34a);
    }
    .callback-card .logo img {
      height: 36px;
    }
    .callback-card .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary, #16a34a);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-card h2 { margin-bottom: 8px; color: #111827; }
    .callback-card p { color: #6b7280; line-height: 1.6; }
    .callback-card .success-icon {
      width: 64px; height: 64px; margin: 16px auto;
      background: #dcfce7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .callback-card .success-icon svg { color: #16a34a; }
    .callback-card .error-icon {
      width: 64px; height: 64px; margin: 16px auto;
      background: #fee2e2; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .callback-card .error-icon svg { color: #dc2626; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="callback-container">
    <div class="callback-card">
      <div class="logo">
        <img src="assets/AgriCore Logo.png" alt="AgriCore Logo">
        AgriCore 🌱
      </div>

      <!-- Loading State -->
      <div id="loadingState">
        <div class="spinner"></div>
        <h2>Verifying your account...</h2>
        <p>Please wait while we complete authentication.</p>
      </div>

      <!-- Success State -->
      <div id="successState" class="hidden">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Authentication Successful!</h2>
        <p id="successMessage">Redirecting to your dashboard...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="hidden">
        <div class="error-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <h2>Authentication Failed</h2>
        <p id="errorMessage">Something went wrong. Please try again.</p>
        <a href="/auth/login" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 32px;background:#16a34a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Back to Login</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script>
    (function() {
      'use strict';

      var loadingState = document.getElementById('loadingState');
      var successState = document.getElementById('successState');
      var errorState = document.getElementById('errorState');
      var successMessage = document.getElementById('successMessage');
      var errorMessage = document.getElementById('errorMessage');

      function showSuccess(msg, redirectUrl) {
        loadingState.classList.add('hidden');
        successState.classList.remove('hidden');
        if (msg) successMessage.textContent = msg;
        if (redirectUrl) {
          setTimeout(function() { window.location.href = redirectUrl; }, 1500);
        }
      }

      function showError(msg) {
        loadingState.classList.add('hidden');
        errorState.classList.remove('hidden');
        if (msg) errorMessage.textContent = msg;
      }

      // Parse hash fragment and query params from Supabase redirect
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(hash);

      // Supabase returns tokens in the hash fragment after email verification
      var accessToken = hashParams.get('access_token');
      var refreshToken = hashParams.get('refresh_token');
      var type = hashParams.get('type') || params.get('type');
      var code = params.get('code');

      // Handle password recovery redirect
      if (type === 'recovery' && accessToken) {
        // Store token temporarily and redirect to reset password page
        sessionStorage.setItem('agricore_reset_token', accessToken);
        showSuccess('Password reset link verified. Redirecting...', '/auth/reset-password');
        return;
      }

      // Handle email verification / OAuth with tokens in hash
      if (accessToken) {
        // Fetch user profile using the access token
        fetch((window.AGRICORE_API_BASE || '/api') + '/auth/me', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.success && data.data) {
              var user = data.data;
              user.token = accessToken;
              AgriCore.setCurrentUser(user);

              // Check verification status for government users
              if (user.role === 'government' && user.verification_status !== 'verified') {
                showSuccess('Email verified! Redirecting...', '/pending-verification');
              } else if (user.role === 'admin') {
                showSuccess('Email verified! Redirecting to admin dashboard...', '/platform/admin/console');
              } else {
                showSuccess('Email verified! Redirecting to dashboard...', '/platform/dashboard');
              }
            } else {
              showError('Failed to load user profile. Please try logging in.');
            }
          })
          .catch(function() {
            showError('Network error. Please try logging in manually.');
          });
        return;
      }

      // Handle Supabase PKCE code exchange (email verification redirect with ?code=)
      if (code) {
        fetch((window.AGRICORE_API_BASE || '/api') + '/auth/callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.success && data.data) {
              var user = data.data.user;
              user.token = data.data.token;
              AgriCore.setCurrentUser(user);

              if (user.role === 'government' && user.verification_status !== 'verified') {
                showSuccess('Email verified! Redirecting...', '/pending-verification');
              } else if (user.role === 'admin') {
                showSuccess('Email verified! Redirecting to admin dashboard...', '/platform/admin/console');
              } else {
                showSuccess('Email verified! Redirecting to dashboard...', '/platform/dashboard');
              }
            } else {
              showError(data.error || 'Authentication failed.');
            }
          })
          .catch(function() {
            showError('Network error during authentication.');
          });
        return;
      }

      // No tokens or code — something went wrong
      showError('No authentication data received. Please try signing in again.');
    })();
  </script>

</body>
</html>
