<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Update your CSP meta tag or server header to include unpkg.com -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com https://unpkg.com;">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Authenticating — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <style>
    .callback-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-main, #f9fafb);
    }
    .callback-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .callback-card .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary, #16a34a);
    }
    .callback-card .logo img {
      height: 36px;
    }
    .callback-card .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary, #16a34a);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .callback-card h2 { margin-bottom: 8px; color: #111827; }
    .callback-card p { color: #6b7280; line-height: 1.6; }
    .callback-card .success-icon {
      width: 64px; height: 64px; margin: 16px auto;
      background: #dcfce7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .callback-card .success-icon svg { color: #16a34a; }
    .callback-card .error-icon {
      width: 64px; height: 64px; margin: 16px auto;
      background: #fee2e2; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .callback-card .error-icon svg { color: #dc2626; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="callback-container">
    <div class="callback-card">
      <div class="logo">
        <img src="assets/AgriCore Logo.png" alt="AgriCore Logo">
        AgriCore 🌱
      </div>

      <!-- Loading State -->
      <div id="loadingState">
        <div class="spinner"></div>
        <h2>Verifying your account...</h2>
        <p>Please wait while we complete authentication.</p>
      </div>

      <!-- Success State -->
      <div id="successState" class="hidden">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Authentication Successful!</h2>
        <p id="successMessage">Redirecting to your dashboard...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="hidden">
        <div class="error-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <h2>Authentication Failed</h2>
        <p id="errorMessage">Something went wrong. Please try again.</p>
        <a href="/auth/login" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 32px;background:#16a34a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Back to Login</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="js/auth-callback.js"></script>

</body>
</html>
