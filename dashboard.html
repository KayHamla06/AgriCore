<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Update your CSP meta tag or server header to include unpkg.com -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com https://unpkg.com https://nominatim.openstreetmap.org;">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="dashboard-layout">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/AgriCore Logo.png" alt="AgriCore Logo">
        AgriCore
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Main</div>
        <div class="nav-item active" data-panel="dashboard">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </div>
        <div class="nav-item" data-panel="farmers" id="sidebarFarmers">
          <i data-lucide="users"></i>
          Farmers
        </div>
        <div class="nav-item" data-panel="analytics">
          <i data-lucide="bar-chart-3"></i>
          Analytics
        </div>
        <div class="nav-item" data-panel="plans">
          <i data-lucide="clipboard-list"></i>
          Plans
        </div>
        <div class="nav-item" data-panel="compare" id="sidebarCompare">
          <i data-lucide="git-compare-arrows"></i>
          Compare
        </div>
        <div class="nav-item" data-panel="map" id="sidebarMap">
          <i data-lucide="map-pin"></i>
          Map View
        </div>
        <div class="nav-item" data-panel="support">
          <i data-lucide="life-buoy"></i>
          Support
        </div>

        <div class="sidebar-section-title">Account</div>
        <div class="nav-item" data-panel="settings">
          <i data-lucide="settings"></i>
          Settings
        </div>
        <a class="nav-item" href="/legal/terms-and-services" style="text-decoration:none;color:inherit;">
          <i data-lucide="file-text"></i>
          Terms & Services
        </a>
        <div class="nav-item" id="logoutBtn">
          <i data-lucide="log-out"></i>
          Logout
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebarAvatar">JD</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">John Doe</div>
            <div class="sidebar-user-role" id="sidebarUserRole">Farmer</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-hamburger" id="sidebarToggle" aria-label="Toggle sidebar">
            <i data-lucide="menu"></i>
          </button>
          <div class="topbar-title">
            <h2 id="topbarTitle">Dashboard</h2>
            <p id="topbarSubtitle">Welcome back</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="topbar-btn" id="notifBtn">
            <i data-lucide="bell"></i>
            <span class="notif-dot" id="notifDot"></span>
          </div>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-dropdown-header">
              <h4>Notifications</h4>
              <span class="notif-count" id="notifCount">0</span>
            </div>
            <div class="notif-dropdown-body" id="notifList"></div>
          </div>
          <div class="topbar-btn" id="topbarProfile">
            <div class="sidebar-avatar" id="topbarAvatar" style="width:28px;height:28px;font-size:.625rem;">JD</div>
          </div>
        </div>
      </header>

      <!-- ==========================================
           DASHBOARD CONTENT — Panels injected by JS
           ========================================== -->
      <div class="dashboard-content" id="dashboardContent">
        <!-- Panel content is generated by js/panels/*.js files -->
      </div>

    </div> <!-- /main-content -->
  </div> <!-- /dashboard-layout -->

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modalContainer">
    <!-- Modals are injected by js/panels/upload-modal.js and create-plan-modal.js -->
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core data & calculations -->
  <script src="js/app.js"></script>

  <!-- Panel files (register HTML + init functions) -->
  <script src="js/panels/farmer-dashboard.js"></script>
  <script src="js/panels/gov-dashboard.js"></script>
  <script src="js/panels/analytics.js"></script>
  <script src="js/panels/farmers-list.js"></script>
  <script src="js/panels/farmer-profile.js"></script>
  <script src="js/panels/plans.js"></script>
  <script src="js/panels/settings.js"></script>
  <script src="js/panels/comparison.js"></script>
  <script src="js/panels/map-view.js"></script>
  <script src="js/panels/support.js"></script>
  <script src="js/panels/upload-modal.js"></script>
  <script src="js/panels/create-plan-modal.js"></script>

  <!-- Router (injects panels, handles navigation) -->
  <script src="js/dashboard.js"></script>

  <!-- Charts (renders after panels are injected) -->
  <script src="js/charts.js"></script>

</body>
</html>
