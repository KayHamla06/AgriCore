<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Update your CSP meta tag or server header to include unpkg.com -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com https://unpkg.com https://nominatim.openstreetmap.org https://cdn.jsdelivr.net;">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Email Verification — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .verify-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-primary);
    }
    .verify-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .verify-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
    }
    .verify-icon.success { color: #16a34a; }
    .verify-icon.error { color: #dc2626; }
    .verify-icon.loading { color: #6b7280; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .verify-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .verify-message {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .verify-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .verify-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="verify-page">
    <div class="verify-card" id="verifyCard">
      <svg class="verify-icon loading" id="verifyIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <h1 class="verify-title" id="verifyTitle">Verifying your email...</h1>
      <p class="verify-message" id="verifyMessage">Please wait while we confirm your email address.</p>
      <div id="verifyActions" style="display:none;"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function() {
      // Supabase now handles email verification via redirect to /auth-callback.html.
      // If a user lands here with old-style ?token= params, redirect them to login.
      // If they land here from a Supabase email link, the URL will have hash tokens
      // which should be handled by auth-callback.html instead.
      var hash = window.location.hash;
      var params = new URLSearchParams(window.location.search);

      // If Supabase tokens are present in the hash, redirect to auth-callback
      if (hash && (hash.includes('access_token') || hash.includes('type='))) {
        window.location.href = '/auth-callback.html' + hash;
        return;
      }

      // If a code query param is present, redirect to auth-callback
      if (params.get('code')) {
        window.location.href = '/auth-callback.html?code=' + encodeURIComponent(params.get('code'));
        return;
      }

      // Otherwise show a message directing the user
      var icon = document.getElementById('verifyIcon');
      var title = document.getElementById('verifyTitle');
      var message = document.getElementById('verifyMessage');
      var actions = document.getElementById('verifyActions');

      icon.className = 'verify-icon success';
      icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
      title.textContent = 'Email Verification';
      message.textContent = 'Please check your inbox and click the verification link we sent you. Once verified, you can log in to your account.';
      actions.style.display = 'block';
      actions.innerHTML = '<a href="/auth/login" class="verify-btn">Go to Login</a>';
    })();
  </script>
</body>
</html>
