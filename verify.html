<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Email Verification — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .verify-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-primary);
    }
    .verify-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .verify-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
    }
    .verify-icon.success { color: #16a34a; }
    .verify-icon.error { color: #dc2626; }
    .verify-icon.loading { color: #6b7280; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .verify-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .verify-message {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .verify-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .verify-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="verify-page">
    <div class="verify-card" id="verifyCard">
      <svg class="verify-icon loading" id="verifyIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <h1 class="verify-title" id="verifyTitle">Verifying your email...</h1>
      <p class="verify-message" id="verifyMessage">Please wait while we confirm your email address.</p>
      <div id="verifyActions" style="display:none;"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const icon = document.getElementById('verifyIcon');
      const title = document.getElementById('verifyTitle');
      const message = document.getElementById('verifyMessage');
      const actions = document.getElementById('verifyActions');

      if (!token) {
        icon.className = 'verify-icon error';
        icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
        title.textContent = 'Invalid Link';
        message.textContent = 'This verification link is missing or invalid. Please request a new one from the signup page.';
        actions.style.display = 'block';
        actions.innerHTML = '<a href="/create/new/account/signup" class="verify-btn">Go to Signup</a>';
        return;
      }

      fetch(AgriCore.API_URL + '/auth/verify-email?token=' + encodeURIComponent(token))
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
          if (result.ok) {
            icon.className = 'verify-icon success';
            icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>';
            title.textContent = 'Email Verified!';
            message.textContent = 'Your email address has been verified successfully. You can now continue with your registration or log in.';
            actions.style.display = 'block';
            actions.innerHTML = '<a href="/auth/login" class="verify-btn">Go to Login</a>';
          } else {
            icon.className = 'verify-icon error';
            icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
            title.textContent = 'Verification Failed';
            message.textContent = result.data.message || 'This link is invalid or has expired. Please request a new verification email.';
            actions.style.display = 'block';
            actions.innerHTML = '<a href="/create/new/account/signup" class="verify-btn">Go to Signup</a>';
          }
        })
        .catch(function() {
          icon.className = 'verify-icon error';
          icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
          title.textContent = 'Connection Error';
          message.textContent = 'Could not reach the server. Please check your connection and try again.';
          actions.style.display = 'block';
          actions.innerHTML = '<a href="' + window.location.href + '" class="verify-btn">Try Again</a>';
        });
    })();
  </script>
</body>
</html>
