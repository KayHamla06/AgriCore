<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Update your CSP meta tag or server header to include unpkg.com -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://*.supabase.co https://api.open-meteo.com https://archive-api.open-meteo.com https://unpkg.com https://nominatim.openstreetmap.org;">
  <base href="/">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password — AgriCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-left">
      <div class="auth-form">
        <a href="/" class="auth-logo">
          <img src="assets/AgriCore Logo.png" alt="AgriCore Logo">
          AgriCore
        </a>

        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle" id="resetSubtitle">Enter a strong new password to finish recovering your account.</p>

        <form id="resetPasswordForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your new password" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary w-full btn-lg">Reset Password</button>
          <div id="resetError" class="form-error" style="text-align:center;margin-top:12px;display:none;"></div>
        </form>

        <p class="auth-footer-text">
          Remembered your password? <a href="/auth/login">Back to login</a>
        </p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-right-content">
        <i data-lucide="shield-check"></i>
        <h2 class="auth-right-title">Secure account recovery</h2>
        <p class="auth-right-text">
          Your reset session is verified through Supabase Auth. Set a strong password and continue securely.
        </p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
